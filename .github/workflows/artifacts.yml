name: Artifacts (Package)

on: [push, pull_request, workflow_dispatch]

jobs:
  artifacts-steamrt-sniper:
    if: github.event_name == 'pull_request' || github.head_ref == ''
    runs-on: ubuntu-latest
    container: 
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:beta
      
    steps:
    - name: Setup problem matcher
      uses: Blisto91/problem-matcher-testing/@main
      with:
        skip-directories: |
          "subprojects
          frog
           æøå "
      
    - name: Checkout code
      id: checkout-code
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Build release
      id: build-release
      shell: bash
      run: |
        export VERSION_NAME="${GITHUB_REF##*/}-${GITHUB_SHA##*/}"
        ./package-native.sh ${VERSION_NAME} build --64-only
        echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
